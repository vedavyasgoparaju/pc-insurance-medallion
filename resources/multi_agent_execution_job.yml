resources:
  jobs:
    multi_agent_execution:
      name: InsuranceModel - Multi-agent execution
      max_concurrent_runs: 1
      parameters:
        - name: execution_plan
          default: '{"version":1,"operations":[]}'
        - name: warehouse_id
          default: ${var.sql_warehouse_id}
        - name: allowed_roots
          default: ${var.allowed_roots}
      tasks:
        - task_key: execute_plan
          spark_python_task:
            python_file: ../execution/plan_executor.py
            parameters:
              - --plan-json
              - "{{job.parameters.execution_plan}}"
              - --warehouse-id
              - "{{job.parameters.warehouse_id}}"
              - --allowed-roots
              - "{{job.parameters.allowed_roots}}"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "5"

    multi_agent_orchestrator:
      name: InsuranceModel - Multi-agent orchestrator
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/5 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      parameters:
        - name: request
          default: ""
        - name: execution_job_id
          default: ${resources.jobs.multi_agent_execution.id}
        - name: supervisor_endpoint
          default: ${var.supervisor_endpoint}
        - name: warehouse_id
          default: ${var.sql_warehouse_id}
        - name: workspace_root
          default: ${var.workspace_root}
      tasks:
        - task_key: orchestrate_request
          spark_python_task:
            python_file: ../execution/orchestrator.py
            parameters:
              - --request
              - "{{job.parameters.request}}"
              - --execution-job-id
              - "{{job.parameters.execution_job_id}}"
              - --supervisor-endpoint
              - "{{job.parameters.supervisor_endpoint}}"
              - --warehouse-id
              - "{{job.parameters.warehouse_id}}"
              - --workspace-root
              - "{{job.parameters.workspace_root}}"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            environment_version: "5"