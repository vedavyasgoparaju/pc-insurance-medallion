# Databricks Workflow for Automated Git Push
# This workflow runs after pipeline execution to commit and push changes

resources:
  jobs:
    git_auto_push_workflow:
      name: "P&C Insurance - Git Auto Push Workflow"
      
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: "13.3.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 2
            spark_conf:
              "spark.databricks.delta.preview.enabled": "true"
      
      tasks:
        - task_key: git_automation
          job_cluster_key: main_cluster
          notebook_task:
            notebook_path: "/Repos/vedavyas.goparaju/pc-insurance-medallion/Git_Automation"
            base_parameters:
              commit_message: "auto: scheduled pipeline execution completed"
              push_enabled: "true"
          timeout_seconds: 300
          
      # Schedule: Run after main pipeline (or can be triggered)
      # Uncomment to enable scheduling:
      # schedule:
      #   quartz_cron_expression: "0 0 2 * * ?"  # Daily at 2 AM
      #   timezone_id: "America/New_York"
      #   pause_status: "UNPAUSED"
      
      # Email notifications
      email_notifications:
        on_failure:
          - "data-engineering@company.com"
      
      # Retry policy
      max_concurrent_runs: 1
      timeout_seconds: 600
      
      # Tags
      tags:
        environment: "production"
        project: "pc-insurance-medallion"
        component: "git-automation"
